name: Build and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux amd64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            qt6-base-dev \
            qt6-base-dev-tools \
            qmake6 \
            qt6-websockets-dev

      - name: Configure and build
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"
          mkdir -p "$GITHUB_WORKSPACE/dist"

          cd "$GITHUB_WORKSPACE/build"

          qmake6 "$GITHUB_WORKSPACE/ChatServerQT.pro" \
            -after \
            CONFIG+=release \
            CONFIG-=debug \
            CONFIG-=debug_and_release \
            CONFIG-=debug_and_release_build \
            TARGET=QWebChat \
            DESTDIR="$GITHUB_WORKSPACE/dist" \
            QMAKE_EXTRA_TARGETS= \
            PRE_TARGETDEPS=

          make -j"$(nproc)"

          if [ ! -f "$GITHUB_WORKSPACE/dist/QWebChat" ]; then
            echo "ERROR: dist/QWebChat was not created"
            find "$GITHUB_WORKSPACE/build" \
              "$GITHUB_WORKSPACE/dist" -type f
            exit 1
          fi

      - name: Package application
        run: |
          mkdir -p package/QWebChat

          install -m 755 dist/QWebChat package/QWebChat/QWebChat
          install -m 644 index.html package/QWebChat/index.html

          tar -czf QWebChat-linux-amd64.tar.gz \
            -C package QWebChat

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: QWebChat-linux-amd64.tar.gz
          if-no-files-found: error

  windows:
    name: Windows amd64
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtwebsockets
          cache: true

      - name: Configure and build
        shell: cmd
        run: |
          if not exist build mkdir build
          if not exist dist mkdir dist
          cd build

          qmake "%GITHUB_WORKSPACE%\ChatServerQT.pro" ^
            -after ^
            CONFIG+=release ^
            CONFIG-=debug ^
            CONFIG-=debug_and_release ^
            CONFIG-=debug_and_release_build ^
            TARGET=QWebChat ^
            "DESTDIR=%GITHUB_WORKSPACE%/dist" ^
            QMAKE_EXTRA_TARGETS= ^
            PRE_TARGETDEPS=

          if errorlevel 1 exit /b 1

          nmake
          if errorlevel 1 exit /b 1

          if not exist "%GITHUB_WORKSPACE%\dist\QWebChat.exe" (
            echo ERROR: dist\QWebChat.exe was not created
            dir /s /b "%GITHUB_WORKSPACE%\build"
            dir /s /b "%GITHUB_WORKSPACE%\dist"
            exit /b 1
          )

      - name: Deploy Qt dependencies
        shell: pwsh
        run: |
          windeployqt `
            --release `
            --compiler-runtime `
            --no-translations `
            --dir "$env:GITHUB_WORKSPACE/dist" `
            "$env:GITHUB_WORKSPACE/dist/QWebChat.exe"

          if ($LASTEXITCODE -ne 0) {
            throw "windeployqt failed with code $LASTEXITCODE"
          }

          Copy-Item `
            -Path index.html `
            -Destination dist/index.html

      - name: Package application
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Path package/QWebChat `
            -Force | Out-Null

          Copy-Item `
            -Path dist/* `
            -Destination package/QWebChat `
            -Recurse `
            -Force

          Compress-Archive `
            -Path package/QWebChat `
            -DestinationPath QWebChat-windows-amd64.zip `
            -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: QWebChat-windows-amd64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - linux
      - windows
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" \
              --verify-tag \
              --title "QWebChat $TAG" \
              --generate-notes
          fi

      - name: Upload release archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" \
            artifacts/QWebChat-linux-amd64.tar.gz \
            artifacts/QWebChat-windows-amd64.zip \
            --clobber
